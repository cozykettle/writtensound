[project]
name = "writtensound"
version = "0.1.0"
description = "Self-hosted, noScribe-style speech-to-text with a multi-engine model catalog."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.118,<1",
  "uvicorn[standard]>=0.37",
  "pydantic>=2.11,<3",
  "jinja2>=3.1",
  "python-multipart>=0.0.20",
  "aiofiles>=24",
  "PyYAML>=6.0",
  "huggingface-hub>=1.0,<2",
]

[project.optional-dependencies]
# The engine stack is deliberately optional so the web app, demo engine and
# test suite can run on a laptop without multi-gigabyte wheels.
engines = [
  "faster-whisper==1.2.1",
  "ctranslate2>=4.5,<5",
  "transformers>=5.13,<6",
  "torch==2.9.*",
  "torchaudio==2.9.*",
  "pyannote.audio>=4.0,<5",
]
dev = [
  "pytest>=9",
  "pytest-asyncio",
  "httpx",
  "ruff>=0.14",
  "mypy>=1.18",
  "types-aiofiles",
  "types-PyYAML",
]

[project.scripts]
writtensound = "backend.__main__:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["templates/**/*.html", "static/*", "db/*.yaml"]

# Keep the committed lock on CPU torch. The CUDA image replaces the torch and
# torchaudio wheels with cu128 builds in its final layer. This keeps the
# standard image free of multi-gigabyte CUDA wheels and keeps both targets on
# one lock file.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "gpu: requires a GPU or a live engine install",
  "slow: long-running integration test",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["tests/", "tools/"]
